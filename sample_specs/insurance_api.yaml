openapi: 3.0.3

info:
  title: Insurance Policy API
  version: 1.0.0
  description: API for creating, retrieving, updating and cancelling insurance policies.

servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: Policies
    description: Insurance policy operations
  - name: Customers
    description: Customer operations

paths:

  /customers/{customerId}:
    get:
      tags:
        - Customers
      summary: Get customer
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          description: Unique customer identifier
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found

  /policies:
    get:
      tags:
        - Policies
      summary: Search policies
      operationId: searchPolicies
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: integer
            minimum: 1

        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PolicyStatus'

        - name: policyType
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PolicyType'

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1

        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20

      responses:
        '200':
          description: Policies retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - policies
                  - total
                properties:
                  policies:
                    type: array
                    items:
                      $ref: '#/components/schemas/Policy'
                  total:
                    type: integer
                    minimum: 0

        '400':
          description: Invalid search parameters

    post:
      tags:
        - Policies
      summary: Create insurance policy
      operationId: createPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePolicyRequest'
      responses:
        '201':
          description: Policy created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'

        '400':
          description: Invalid policy request

        '404':
          description: Customer not found

        '409':
          description: Policy already exists

  /policies/{policyId}:
    get:
      tags:
        - Policies
      summary: Get policy
      operationId: getPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          description: Unique policy identifier
          schema:
            type: string
            pattern: '^POL-[0-9]{8}$'
      responses:
        '200':
          description: Policy found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'

        '404':
          description: Policy not found

    put:
      tags:
        - Policies
      summary: Update policy
      operationId: updatePolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            pattern: '^POL-[0-9]{8}$'

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePolicyRequest'

      responses:
        '200':
          description: Policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'

        '400':
          description: Invalid update request

        '404':
          description: Policy not found

    delete:
      tags:
        - Policies
      summary: Cancel policy
      operationId: cancelPolicy
      parameters:
        - name: policyId
          in: path
          required: true
          schema:
            type: string
            pattern: '^POL-[0-9]{8}$'

      responses:
        '204':
          description: Policy cancelled successfully

        '404':
          description: Policy not found

        '409':
          description: Policy cannot be cancelled in its current state

components:

  schemas:

    PolicyStatus:
      type: string
      enum:
        - QUOTE
        - ACTIVE
        - EXPIRED
        - CANCELLED

    PolicyType:
      type: string
      enum:
        - AUTO
        - HOME
        - LIFE

    Customer:
      type: object
      required:
        - customerId
        - firstName
        - lastName
        - email
      properties:
        customerId:
          type: integer
          minimum: 1

        firstName:
          type: string
          minLength: 1
          maxLength: 50

        lastName:
          type: string
          minLength: 1
          maxLength: 50

        email:
          type: string
          format: email

        phone:
          type: string
          pattern: '^\+?[1-9][0-9]{7,14}$'

    CreatePolicyRequest:
      type: object
      required:
        - customerId
        - policyType
        - effectiveDate
        - expirationDate
        - premium
      properties:

        customerId:
          type: integer
          minimum: 1

        policyType:
          $ref: '#/components/schemas/PolicyType'

        effectiveDate:
          type: string
          format: date

        expirationDate:
          type: string
          format: date

        premium:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000000

        deductible:
          type: number
          format: double
          minimum: 0
          maximum: 100000

        coverageAmount:
          type: number
          format: double
          minimum: 1000
          maximum: 10000000

    UpdatePolicyRequest:
      type: object
      properties:

        premium:
          type: number
          format: double
          minimum: 0.01
          maximum: 1000000

        deductible:
          type: number
          format: double
          minimum: 0
          maximum: 100000

        coverageAmount:
          type: number
          format: double
          minimum: 1000
          maximum: 10000000

        expirationDate:
          type: string
          format: date

    Policy:
      type: object
      required:
        - policyId
        - customerId
        - policyType
        - status
        - effectiveDate
        - expirationDate
        - premium
      properties:

        policyId:
          type: string
          pattern: '^POL-[0-9]{8}$'

        customerId:
          type: integer
          minimum: 1

        policyType:
          $ref: '#/components/schemas/PolicyType'

        status:
          $ref: '#/components/schemas/PolicyStatus'

        effectiveDate:
          type: string
          format: date

        expirationDate:
          type: string
          format: date

        premium:
          type: number
          format: double
          minimum: 0

        deductible:
          type: number
          format: double
          minimum: 0

        coverageAmount:
          type: number
          format: double
          minimum: 0